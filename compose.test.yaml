services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prepbuddy_test
      POSTGRES_USER: prepbuddy_test
      POSTGRES_PASSWORD: ${PREPBUDDY_TEST_PASSWORD:?Use tools/test_postgresql.py}
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
