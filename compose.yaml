services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prepbuddy
      POSTGRES_USER: prepbuddy
      POSTGRES_PASSWORD: prepbuddy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepbuddy -d prepbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - prepbuddy_postgres_data:/var/lib/postgresql/data

volumes:
  prepbuddy_postgres_data:

